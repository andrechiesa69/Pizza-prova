<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizzatore AR - Pizza</title>
  <!-- Carica il componente Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
      font-family: Arial, sans-serif;
    }
    model-viewer { 
      width: 100%; 
      height: 100%; 
      background-color: #f5f5f5;
    }
    .ar-button {
      position: absolute; 
      bottom: 30px; 
      left: 50%; 
      transform: translateX(-50%); 
      padding: 14px 28px; 
      background-color: #e63946; 
      color: white; 
      border: none; 
      border-radius: 30px; 
      font-size: 16px; 
      font-weight: bold;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.25);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Configurazione per il file pizza01.glb -->
  <model-viewer 
    src="pizza01.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1">
    
    <!-- Pulsante per attivare la Realtà Aumentata -->
    <button slot="ar-button" class="ar-button">
      🍕 Vedi sul tuo tavolo (AR)
    </button>
    
  </model-viewer>

</body>
</html>
