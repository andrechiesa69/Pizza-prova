<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pizza 3D AR</title>

  <!-- Libreria Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Pulsante riposizionato IN ALTO per evitare le barre di Safari e Chrome */
    .ar-button {
      background-color: #e63946;
      color: #ffffff;
      border: none;
      padding: 16px 28px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 50px;
      position: absolute;
      top: 30px; /* Posizionato in alto */
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .ar-button:active {
      transform: translateX(-50%) scale(0.95);
      background-color: #d62828;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="pizza01.glb" 
    ios-src="pizza01.usdz" 
    alt="Pizza 3D" 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    ar-scale="fixed"
    ar-placement="floor"
    camera-controls 
    auto-rotate
    shadow-intensity="1.2"
    shadow-softness="0.8"
    quick-look-browsers="safari chrome">
    
    <button slot="ar-button" class="ar-button">
      🍕 VEDI SUL TAVOLO (AR)
    </button>

  </model-viewer>

</body>
</html>
