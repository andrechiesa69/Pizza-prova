<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pizza 3D AR</title>

  <!-- Libreria Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
    }

    /* Pulsante AR visibile in alto */
    .ar-button {
      background-color: #ff3b30;
      color: #ffffff;
      border: none;
      padding: 18px 36px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 50px;
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 8px 25px rgba(255, 59, 48, 0.4);
      cursor: pointer;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }

    .ar-button:active {
      transform: translateX(-50%) scale(0.95);
      background-color: #e02b20;
    }
  </style>
</head>
<body>

  <!-- Collegamento nativo rapido per iOS/Safari e Android -->
  <a id="ios-ar-link" rel="ar" href="pizza01.usdz" style="display: none;">
    <img src="pizza01.glb" alt="Pizza AR">
  </a>

  <model-viewer 
    id="viewer"
    src="pizza01.glb" 
    ios-src="pizza01.usdz" 
    alt="Pizza 3D" 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    scale="10 10 10"
    camera-controls 
    auto-rotate
    shadow-intensity="1">
    
    <button slot="ar-button" id="custom-ar-btn" class="ar-button">
      🍕 VEDI SUL TAVOLO (AR)
    </button>

  </model-viewer>

  <script>
    // Rileva se l'utente è su iPhone/iPad e avvia Quick Look
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const arButton = document.getElementById('custom-ar-btn');
    const iosLink = document.getElementById('ios-ar-link');

    if (isIOS) {
      arButton.addEventListener('click', (e) => {
        e.preventDefault();
        iosLink.click();
      });
    }
  </script>

</body>
</html>
