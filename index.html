<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza in Realtà Aumentata</title>

  <!-- Libreria Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Pulsante AR visibile sia su Android che su iOS */
    .ar-button {
      background-color: #e63946;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s ease, transform 0.2s ease;
      z-index: 10;
    }

    .ar-button:active {
      transform: translateX(-50%) scale(0.96);
      background-color: #d62828;
    }
  </style>
</head>
<body>

  <!-- Componente 3D e AR configurato con i file pizza01 -->
  <model-viewer 
    src="pizza01.glb" 
    ios-src="pizza01.usdz" 
    alt="Pizza 3D" 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    camera-controls 
    auto-rotate
    shadow-intensity="1.2"
    shadow-softness="0.8"
    touch-action="pan-y">
    
    <button slot="ar-button" class="ar-button">
      🍕 Posiziona la pizza sul tavolo
    </button>

  </model-viewer>

</body>
</html>
