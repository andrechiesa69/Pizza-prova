<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza 3D AR - Compatibile Android e iOS</title>

  <!-- Libreria Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
    }

    /* Pulsante AR visibile su entrambi i sistemi */
    .ar-button {
      background-color: #e63946;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      cursor: pointer;
      z-index: 100;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="pizza.glb" 
    ios-src="pizza.usdz" 
    alt="Pizza 3D" 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    camera-controls 
    auto-rotate
    shadow-intensity="1">
    
    <button slot="ar-button" class="ar-button">
      🍕 Proietta la pizza sul tavolo
    </button>

  </model-viewer>

</body>
</html>
