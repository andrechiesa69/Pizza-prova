<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pizza in Realtà Aumentata</title>

  <!-- Libreria Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Pulsante AR ben visibile al centro-basso dello schermo */
    .ar-button {
      background-color: #e63946;
      color: #ffffff;
      border: none;
      padding: 16px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 6px 20px rgba(230, 57, 70, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 999;
      animation: pulse 2s infinite;
    }

    /* Animazione per attirare l'attenzione sul pulsante */
    @keyframes pulse {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
      100% { transform: translateX(-50%) scale(1); }
    }
  </style>
</head>
<body>

  <model-viewer 
    src="pizza01.glb" 
    ios-src="pizza01.usdz" 
    alt="Pizza 3D" 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    camera-controls 
    auto-rotate
    shadow-intensity="1"
    quick-look-browsers="safari chrome">
    
    <button slot="ar-button" class="ar-button">
      🍕 VEDI SUL TAVOLO (AR)
    </button>

  </model-viewer>

</body>
</html>
